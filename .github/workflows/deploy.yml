name: Build and Deploy

on:
  push:
    branches:
      - main
      - feat/ci-pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # FAILURE 1: No registry authentication step before pushing.
      # The push below will fail with "401 authentication required".

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # FAILURE 2: Wrong image tag. Not namespaced to the Docker Hub
          # user and not tagged with the commit SHA.
          tags: ${{ secrets.DOCKERHUB_USER }}/app:${{ github.sha }}

  # FAILURE 3: Deploy job does not wait for the build job to finish.
  # It runs in parallel and tries to use an image that was never pushed.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy with Docker Compose
       run: |
         export DOCKERHUB_USER=${{ secrets.DOCKERHUB_USER }}
         export IMAGE_TAG=${{ github.sha }}
         docker compose up -d
         sleep 5
         curl -f http://localhost:8080/health